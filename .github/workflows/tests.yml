name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-26.04]
        # The app needs 3.12+ (see MIN_PYTHON in youtube_downloader.py); test
        # the oldest supported and the newest.
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # The tests open real Qt windows on Qt's "offscreen" platform: no
      # display needed, and nothing shows up (the tests set it too).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The libraries Qt's GUI module links to on Linux, and ffmpeg for the
      # real yt-dlp MP3 test (tests/test_real_yt_dlp.py; it's skipped where
      # ffmpeg is missing).
      - name: Install Qt's libraries and ffmpeg
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Same as a machine without yt-dlp: the app must still start, and the
      # yt-dlp-dependent tests must skip rather than fail.
      - name: Run tests without yt-dlp
        shell: bash
        run: >-
          python -c "import sys, unittest;
          sys.modules['yt_dlp'] = None;
          unittest.main(module=None, argv=['tests', 'discover', '-s', 'tests', '-v'])"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: python -m pip install -r requirements-dev.txt

      # Rules are in ruff.toml. "github" output puts findings on the PR's lines.
      - name: Run ruff
        run: ruff check --output-format=github .
