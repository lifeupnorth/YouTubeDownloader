name: Smoke test

# Every night (and by hand): downloads one short YouTube video for real, as
# MP4 and MP3, from source and with a freshly built .exe. YouTube changes
# break yt-dlp regularly; this shows it before users report it. The unit
# tests never touch the network, so they can't catch that.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  # And when the smoke test itself changes, so a change to it gets tried.
  pull_request:
    paths:
      - "packaging/smoke_test.py"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  source:
    name: From source (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # The JavaScript runtime yt-dlp uses for YouTube, as the .exe bundles.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download for real
        run: python packaging/smoke_test.py
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}

  exe:
    name: The .exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      # As in build-exe.yml: the build tools are checked against their hashes.
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --require-hashes -r packaging/requirements-build.txt

      - name: Build and check the .exe
        run: |
          python packaging/build_exe.py
          python packaging/build_exe.py --check

      - name: Download for real with the .exe
        run: python packaging/smoke_test.py --exe dist/YT-Downloader.exe
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
