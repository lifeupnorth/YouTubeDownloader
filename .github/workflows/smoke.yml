name: Smoke test

# Every night (and by hand): downloads one short YouTube video for real, as
# MP4 and MP3, from source and with a freshly built .exe. YouTube changes
# break yt-dlp regularly; this shows it before users report it. The unit
# tests never touch the network, so they can't catch that.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  # And when the smoke test itself changes, so a change to it gets tried.
  pull_request:
    paths:
      - "packaging/smoke_test.py"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  source:
    name: From source (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download for real
        run: python packaging/smoke_test.py
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}

  exe:
    name: The .exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build and check the .exe
        run: |
          python packaging/build_exe.py
          python packaging/build_exe.py --check

      - name: Download for real with the .exe
        run: python packaging/smoke_test.py --exe dist/YT-Downloader.exe
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
