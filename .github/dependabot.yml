# Keeps the yt-dlp pin in requirements.txt current: YouTube changes regularly
# break older yt-dlp versions. The app reads the pin from requirements.txt, so
# a Dependabot PR is a complete update on its own.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Keeps the action versions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # PyInstaller, which builds the Windows .exe.
  - package-ecosystem: "pip"
    directory: "/packaging"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
